name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc -b --force

      - run: npm run lint

      - run: npm test

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
